# Pre-Commit Hooks & Quality Gates Configuration
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-requests]
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: pytest-cov-check
        name: Pytest Coverage Gate (>=90%)
        entry: py -m pytest --cov=src --cov-fail-under=90 tests/
        language: system
        pass_filenames: false
        always_run: true
