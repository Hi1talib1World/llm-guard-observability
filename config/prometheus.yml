# Prometheus Configuration for LLM Guard & Observability
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/prometheus_rules.yml"

scrape_configs:
  - job_name: "llm_guard_proxy"
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: "otel_collector"
    static_configs:
      - targets: ["otel-collector:8889"]
