name: Production CI/CD & Semantic Release Pipeline

on:
  push:
    branches:
      - main

jobs:
  quality-gate:
    name: Lint, Typecheck & Coverage Gate (>=90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov build
          pip install -e .

      - name: Ruff Lint & Format Check
        run: |
          ruff check src/
          ruff format --check src/

      - name: Mypy Type Check
        run: mypy src/ --ignore-missing-imports

      - name: Pytest Coverage Gate (>=90%)
        run: pytest --cov=src --cov-fail-under=90 tests/

  semantic-release:
    name: Semantic Release & PyPI Publish
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for Semantic Release
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Semantic Release Plugins
        run: |
          npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/changelog @semantic-release/github @semantic-release/exec

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
